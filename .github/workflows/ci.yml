name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: cd services/api && uv sync --frozen && uv run ruff check . && uv run mypy src && uv run pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: cd apps/web && pnpm install --frozen-lockfile && pnpm test --run && pnpm lint && pnpm build
      - run: cd apps/web && pnpm exec playwright install --with-deps chromium && CI=1 pnpm exec playwright test
      # The ONLY guard on the n8n workflow's JS. It extracts the real code out
      # of the workflow JSON and asserts the rules that, if broken, silently
      # poison the learning loop. It already encodes three rounds of found bugs.
      - run: node docs/n8n/check-code-nodes.js
